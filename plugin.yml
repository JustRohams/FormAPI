name: GiftCode
main: RohaM\GiftCode\Loader
version: 1.0.0
api: ["5.0.0"]
author: RohaM
description: Gift code plugin with EconomyAPI support
depend: ["EconomyAPI"]

permissions:
  giftcode.create:
    description: Allows creating gift codes
    default: op
  giftcode.use:
    description: Allows using gift codes
    default: true